*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;width:100%;height:100%;overflow:hidden;background:#3d8fe8;color:#fff;font-family:"ZB","Trebuchet MS",system-ui,sans-serif;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;overscroll-behavior:none;touch-action:none}
body{position:fixed;inset:0}
canvas#game{position:fixed;left:0;top:0;width:100%;height:100%;display:block;touch-action:none}
.hidden{display:none!important}
button{font-family:inherit;cursor:pointer}
.screen{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:calc(env(safe-area-inset-top) + 14px) calc(env(safe-area-inset-right) + 14px) calc(env(safe-area-inset-bottom) + 12px) calc(env(safe-area-inset-left) + 14px);z-index:10}
.dim{background:rgba(18,34,90,.55);backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px)}
.screen.show>*{animation:pop .42s cubic-bezier(.2,1.5,.4,1) both}
@keyframes pop{from{opacity:0;transform:translateY(16px) scale(.9)}to{opacity:1;transform:none}}
.panel{position:relative;width:100%;max-width:400px;max-height:100%;display:flex;flex-direction:column;gap:10px;background:linear-gradient(180deg,#fff,#eaf3ff);border:4px solid #fff;border-radius:28px;color:#1f3170;padding:38px 18px 18px;box-shadow:0 8px 0 #9cb8e4,0 24px 44px rgba(10,30,90,.45)}
.panel h2{position:absolute;left:50%;top:-24px;transform:translateX(-50%);margin:0;white-space:nowrap;padding:6px 28px;font-size:26px;color:#fff;border-radius:18px;background:linear-gradient(180deg,#5fb4ff,#2a6fe0);box-shadow:0 5px 0 #1a4aa6;text-shadow:0 2px 0 rgba(0,0,0,.25);font-weight:400}
.panel p{margin:0;text-align:center;font-size:18px;line-height:1.3}
.btn{position:relative;display:flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:18px;padding:10px 18px;min-height:54px;font-size:22px;color:#fff;background:linear-gradient(180deg,#6fd0ff,#2a86e8);box-shadow:0 6px 0 #1a56b0,0 10px 18px rgba(0,0,0,.25);text-shadow:0 2px 0 rgba(0,0,0,.25);width:100%}
.btn::before{content:"";position:absolute;left:7%;right:7%;top:4px;height:40%;border-radius:14px;background:linear-gradient(180deg,rgba(255,255,255,.55),rgba(255,255,255,0));pointer-events:none}
.btn:active{transform:translateY(5px);box-shadow:0 1px 0 #1a56b0}
.btn.g{background:linear-gradient(180deg,#8ef06a,#2fb84a);box-shadow:0 6px 0 #1d7a2e,0 10px 18px rgba(0,0,0,.25)}
.btn.o{background:linear-gradient(180deg,#ffd76a,#ff9a1e);box-shadow:0 6px 0 #b55e00,0 10px 18px rgba(0,0,0,.25)}
.btn.r{background:linear-gradient(180deg,#ff8a9a,#e8404f);box-shadow:0 6px 0 #a01e2c,0 10px 18px rgba(0,0,0,.25)}
.btn.gr{background:linear-gradient(180deg,#c3cde0,#8592ad);box-shadow:0 6px 0 #5a6580,0 10px 18px rgba(0,0,0,.2)}
.btn.big{min-height:66px;font-size:30px}
.btn[disabled]{filter:grayscale(.9) brightness(.9)}
.row{display:flex;gap:10px;width:100%}
.coin{display:inline-block;width:20px;height:20px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff7b8,#ffc928 50%,#d27c00);border:2px solid #9a5200;vertical-align:-3px;flex:none}
/* HUD */
#hud{position:fixed;inset:0;pointer-events:none;z-index:5}
#hud .top{position:absolute;left:0;right:0;top:0;display:flex;align-items:flex-start;gap:8px;padding:calc(env(safe-area-inset-top) + 10px) calc(env(safe-area-inset-right) + 10px) 0 calc(env(safe-area-inset-left) + 10px)}
.hb{pointer-events:auto;position:relative;width:48px;height:48px;border-radius:15px;border:0;background:linear-gradient(180deg,#7cc6ff,#2f7fe6);box-shadow:0 5px 0 #1c4fa8,0 8px 14px rgba(0,0,0,.25),inset 0 2px 0 rgba(255,255,255,.5);display:flex;align-items:center;justify-content:center;flex:none}
.hb:active{transform:translateY(4px);box-shadow:0 1px 0 #1c4fa8}
.hb svg{width:26px;height:26px}
.badge{position:absolute;right:-7px;top:-7px;min-width:22px;height:22px;padding:0 5px;border-radius:11px;background:#ff4b5c;border:2px solid #fff;font-size:13px;line-height:18px;color:#fff;text-align:center}
.badge.plus{background:#3cc85a;font-size:17px;line-height:17px}
#lvl{flex:1;text-align:center;font-size:27px;color:#fff;-webkit-text-stroke:5px #23408f;paint-order:stroke fill;text-shadow:0 3px 0 rgba(20,40,110,.6);line-height:1.1;padding-top:6px;pointer-events:none}
#lvl small{display:block;font-size:13px;letter-spacing:1px;-webkit-text-stroke:3px #23408f}
#coins{pointer-events:auto;display:flex;align-items:center;gap:5px;height:34px;margin-top:7px;padding:0 10px 0 6px;border-radius:17px;background:rgba(20,40,100,.55);border:2px solid rgba(255,255,255,.7);font-size:17px}
#pw{position:absolute;display:flex;gap:min(4vw,22px);justify-content:center;pointer-events:none}

  $('pVip').classList.toggle('on', P.vipMode);
  if (P.L) $('lvl').innerHTML = 'Level ' + P.L.n + '<small>' + th().name + '</small>';

function addCoins(n) { SAVE.coins = Math.max(0, SAVE.coins + n); saveGame(); updHUD(); }

function modal(title, text, btns, stars) {
  $('mT').textContent = title; $('mP').innerHTML = text; const st = $('mS'); if (stars != null) { st.classList.remove('hidden'); st.innerHTML = [0, 1, 2].map(i => '<i class="' + (i < stars ? '' : 'off') + '"></i>').join(''); } else st.classList.add('hidden');
  const box = $('mB'); box.innerHTML = ''; for (const [label, cls, fn] of btns) { const b = document.createElement('button'); b.className = 'btn ' + cls; b.innerHTML = label; b.onclick = () => { ensureAudio(); SFX.click(); if (!fn || fn() !== false) { if (!fn || !b.dataset.keep) { if (curScreen === 'sModal') { hideAll(); if (G.state === 'modal') G.state = 'play'; } } } }; box.appendChild(b); }
  if (G.state === 'play') G.state = 'modal'; show('sModal');
}
const PRICES = { vip: 180, arrange: 140, jumble: 120, undo: 60 };
const PNAME = { vip: 'VIP', arrange: 'Arrange', jumble: 'Jumble', undo: 'Undo' };
const PDESC = { vip: 'Fly any vehicle straight to the VIP spot, even if it is blocked.', arrange: 'Sort the queue so passengers who fit your parked vehicles step to the front.', jumble: 'Reshuffle the colours of the vehicles still in the lot.', undo: 'Take back your last move.' };
function buyModal(k) {
  const pr = PRICES[k];
  modal(PNAME[k], PDESC[k] + '<br><br>Get <b>3</b> for <i class="coin"></i> <b>' + pr + '</b>?<br><small>You have ' + SAVE.coins + ' coins</small>', [['Buy 3 &nbsp;<i class="coin"></i> ' + pr, 'g', () => { if (!spend(pr, PNAME[k])) return false; SAVE.boosters[k] += 3; saveGame(); updHUD(); }], ['No thanks', 'gr', null]]);
}
function unlockModal() {
  const pr = 100 + P.unlocked * 60;
  modal('Extra spot', 'Open one more parking spot for this level?', [['Open &nbsp;<i class="coin"></i> ' + pr, 'g', () => { if (!spend(pr, 'extra_slot', 'slot')) return false; doUnlock(); }], ['Cancel', 'gr', null]]);
}
function doUnlock() { P.unlocked++; P.s.slots = 4 + P.unlocked; const q = LAY.slots[4 + P.unlocked]; sparkle(q.x, q.y, '#6fe08a', 16); SFX.unlock(); queueEvents(board(P.L, P.s)); }
// ---- level flow ----
function startLevel(n) {
  n = clamp(n | 0, 1, MAX_LVL); loadLevel(n); G.state = 'play'; hideAll(); $('hud').classList.remove('hidden'); placeHUD(); updHUD(); setBanner(null);
  playMusic(th().music); ztPlay(true);
  zt('level_start', { level: n, mode: 'levels', theme: th().id }); if (n === 1) zt('game_start', { mode: 'levels', level: n });
  P.tutor = null; if (n === 1 && !SAVE.tut.t1) { P.tutor = { id: -1, step: 0 }; zt('tutorial_begin', { tutorial_id: 'drive_out' }); }
  else if (n === 3 && !SAVE.tut.pw) { SAVE.tut.pw = 1; saveGame(); setTimeout(() => { if (G.state === 'play') { setBanner('Stuck? Try the power-ups below!'); setTimeout(() => setBanner(null), 3500); } }, 1200); }
}
function tutUpdate() { const T = P.tutor; const L = P.L, s = P.s; if (busy() && T.step > 0) { T.hand = null; return; } const want = L.Q[s.qi]; let best = -1; for (let i = 0; i < L.V.length; i++) if (!s.gone[i] && L.V[i].col === want && isClear(L.V, i, s.gone)) { best = i; break; } T.id = best; if (best >= 0) { const [x, y] = L2S(L.V[best].x, L.V[best].y); T.hand = [x, y - LAY.h3]; setBanner(T.step === 0 ? 'Tap a vehicle: it drives out the way its arrow points' : 'Pick the colour the queue needs next'); } else T.hand = null; }
function tutAdvance() { const T = P.tutor; T.step++; if (T.step >= 3) { P.tutor = null; SAVE.tut.t1 = 1; saveGame(); setBanner(null); zt('tutorial_complete', { tutorial_id: 'drive_out' }); } }
function starsFor() { return P.cont ? 1 : P.used === 0 ? 3 : P.used <= 2 ? 2 : 1; }
function levelWon() {
  const n = P.L.n, stars = starsFor(), coins = 20 + Math.min(40, Math.floor(n / 5)) + (stars === 3 ? 10 : 0);
  if ((SAVE.stars[n] || 0) < stars) SAVE.stars[n] = stars; if (SAVE.lvl <= n) SAVE.lvl = Math.min(MAX_LVL, n + 1); SAVE.stats.wins++; addCoins(coins); saveGame();
  zt('level_end', { level: n, mode: 'levels', success: true, stars }); zt('post_score', { score: stars, level: n }); zt('earn_virtual_currency', { virtual_currency_name: 'coins', value: coins, item_name: 'level_win' }); ztPing('level_clear');
  SFX.win(); confetti(110); setBanner(null); vibrate([30, 40, 30]); G.state = 'result';
  setTimeout(() => { modal('Level ' + n + ' clear!', '+' + coins + ' <i class="coin"></i>', [['Next', 'g big', () => { startLevel(n + 1); }], ['Levels', '', () => openLevels()]], stars); G.state = 'result'; }, 700);
}
function levelLost() {
  SFX.fail(); vibrate(80); G.state = 'result'; ztPlay(false);
  zt('level_end', { level: P.L.n, mode: 'levels', success: false, reason: 'slots_full' }); zt('game_over', { level: P.L.n, mode: 'levels', reason: 'slots_full' }); ztPing('game_over');
  const pr = 150 + P.cont * 100, btns = [];
  if (P.hist.length && SAVE.boosters.undo > 0) btns.push(['Undo last move (' + SAVE.boosters.undo + ')', 'o', () => { G.state = 'play'; P.over = false; undo(); }]);
  btns.push(['Continue &nbsp;<i class="coin"></i> ' + pr, 'g', () => { if (!spend(pr, 'continue', 'continue')) return false; P.cont++; G.state = 'play'; P.over = false; doContinue(); }]);
  btns.push(['Retry', 'r', () => startLevel(P.L.n)], ['Levels', 'gr', () => openLevels()]);
  modal('Out of space!', 'Every parking spot is taken.', btns);
}
function doContinue() {
  if (P.unlocked < 3) { doUnlock(); return; }
  // all spots open: send the emptiest parked vehicle back to its lot space, its riders return to the front of the queue
  const s = P.s, L = P.L; const p = s.parked.filter(q => q.slot >= 0).sort((a, b) => a.fill - b.fill)[0]; if (!p) return;
  const col = L.V[p.id].col; L.Q.splice(s.qi, 0, ...new Array(p.fill).fill(col)); s.parked.splice(s.parked.indexOf(p), 1); s.gone[p.id] = 0;
  P.qDep = P.qShow = s.qi; resyncVO(); SFX.undo();
}
function openTitle() { G.state = 'title'; $('hud').classList.add('hidden'); setBanner(null); if (!P.L) loadLevel(SAVE.lvl); show('sTitle'); $('bPlay').textContent = 'Play  Level ' + SAVE.lvl; const g = SAVE.lastGift === todayStr(); $('bGift').disabled = g; $('bGift').textContent = g ? 'Gift claimed' : 'Free gift'; playMusic('title'); }
function openLevels() {
  G.state = 'levels'; ztPlay(false); $('hud').classList.add('hidden'); show('sLevels'); const grid = $('lvGrid'), max = Math.min(MAX_LVL, Math.max(60, Math.ceil((SAVE.lvl + 25) / 5) * 5)); let h = '';
  const tc = ['#3fb6e8', '#6a8fb5', '#86b8e8', '#5a5fb8'];
  for (let n = 1; n <= max; n++) { const lk = n > SAVE.lvl, st = SAVE.stars[n] || 0, t = Math.floor((n - 1) / 5) % 4; h += '<button class="lv' + (lk ? ' lock' : '') + (n === SAVE.lvl ? ' cur' : '') + '" data-n="' + n + '" style="background:linear-gradient(180deg,' + shade(tc[t], 1.25) + ',' + tc[t] + ')">' + n + '<i>' + (st ? '★'.repeat(st) : '') + '</i></button>'; }
  grid.innerHTML = h; const cur = grid.querySelector('.cur'); if (cur) grid.scrollTop = Math.max(0, cur.offsetTop - grid.clientHeight / 2);
}
function openSettings() { G.state = 'settings'; show('sSettings'); for (const t of document.querySelectorAll('.tog')) t.classList.toggle('on', !!SAVE.settings[t.dataset.k]); }
function pauseGame() { if (G.state !== 'play') return; G.state = 'paused'; ztPlay(false); show('sPause'); $('bPSound').textContent = 'Sound ' + (SAVE.settings.sound ? 'On' : 'Off'); applyVolumes(); }
function resumeGame() { hideAll(); G.state = 'play'; ztPlay(true); applyVolumes(); }
// ---- loop / resize ----
let lastTs = 0, perfAcc = 0, perfN = 0, perfLow = 0;
function resize() {
  VW = window.innerWidth; VH = window.innerHeight; readSafe(); DPR = Math.min(window.devicePixelRatio || 1, DPR_CAP);
  cv.width = Math.round(VW * DPR); cv.height = Math.round(VH * DPR); computeLayout(); if (P.L) layoutLevel(); placeHUD();
}
function frame(ts) {
  requestAnimationFrame(frame); const dt = Math.min(0.05, (ts - (lastTs || ts)) / 1000); lastTs = ts;
  try {
    if (G.state === 'play' || G.state === 'result' || G.state === 'modal') update(dt); else if (P.L) { P.t += dt; for (const o of P.VO) o.sq = Math.max(0, o.sq - dt); P.qShow += (P.qDep - P.qShow) * Math.min(1, dt * 12); }
    draw();
  } catch (e) { if (!frame.err) { frame.err = 1; zt('js_error', { msg: String(e && e.message).slice(0, 90), where: 'frame' }); } }
  if (toastT > 0) { toastT -= dt; if (toastT <= 0) $('toast').classList.remove('on'); }
  // adaptive quality: drop resolution if frames are slow
  if (G.state === 'play' && dt > 0) { perfAcc += dt; perfN++; if (perfN >= 90) { const avg = perfAcc / perfN; perfAcc = 0; perfN = 0; if (avg > 0.026 && DPR_CAP > 1) { perfLow++; if (perfLow >= 2) { DPR_CAP = DPR_CAP > 1.5 ? 1.5 : 1; QUAL.parts = 0.6; perfLow = 0; resize(); } } else perfLow = 0; } }
}
function bind(id, fn) { $(id).addEventListener('click', e => { ensureAudio(); SFX.click(); fn(e); }); }
function init() {
  loadSave(); resize(); drawIcons();
  window.addEventListener('resize', resize); window.addEventListener('orientationchange', () => setTimeout(resize, 200));
  cv.addEventListener('pointerdown', onPointer);
  bind('bPlay', () => startLevel(SAVE.lvl)); bind('bLevels', openLevels); bind('bSettings', openSettings);
  bind('bGift', () => { if (SAVE.lastGift === todayStr()) return; SAVE.lastGift = todayStr(); addCoins(100); zt('earn_virtual_currency', { virtual_currency_name: 'coins', value: 100, item_name: 'daily_gift' }); SFX.coin(); confetti(40, VW / 2, VH / 2); toast('+100 coins!'); openTitle(); });
  bind('bLvBack', () => { if (P.L && P.s && !P.over && P.s.qi > 0 && G.prevPlay) { G.prevPlay = false; } openTitle(); });
  $('lvGrid').addEventListener('click', e => { const b = e.target.closest('.lv'); if (!b) return; ensureAudio(); const n = +b.dataset.n; if (n > SAVE.lvl) { SFX.deny(); toast('Locked: finish level ' + SAVE.lvl + ' first'); return; } SFX.click(); startLevel(n); });
  bind('bSetBack', openTitle);
  for (const t of document.querySelectorAll('.tog')) t.addEventListener('click', () => { ensureAudio(); const k = t.dataset.k; SAVE.settings[k] = !SAVE.settings[k]; saveGame(); t.classList.toggle('on', SAVE.settings[k]); applyVolumes(); SFX.click(); zt('settings_change', { setting: k, value: String(SAVE.settings[k]) }); if (k === 'vibe' && SAVE.settings[k]) vibrate(30); });
  bind('bPause', pauseGame); bind('bResume', resumeGame); bind('bRestart', () => startLevel(P.L.n)); bind('bPLevels', openLevels); bind('bPHome', openTitle);
  bind('bPSound', () => { SAVE.settings.sound = !SAVE.settings.sound; SAVE.settings.music = SAVE.settings.sound; saveGame(); applyVolumes(); $('bPSound').textContent = 'Sound ' + (SAVE.settings.sound ? 'On' : 'Off'); });
  bind('bUndo', () => { if (G.state === 'play') undo(); });
  $('pVip').addEventListener('click', () => usePower('vip')); $('pArr').addEventListener('click', () => usePower('arr')); $('pJum').addEventListener('click', () => usePower('jum'));
  document.addEventListener('visibilitychange', () => { if (document.hidden && G.state === 'play') pauseGame(); });
  window.addEventListener('keydown', e => { if (e.key === 'Escape') { if (G.state === 'play') pauseGame(); else if (G.state === 'paused') resumeGame(); } if ((e.key === 'z' || e.key === 'u') && G.state === 'play') undo(); });
  openTitle(); requestAnimationFrame(frame);
}
init();
