<script>
// ================= utilities & save =================
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lerp = (a, b, t) => a + (b - a) * t;
const easeOut = t => 1 - Math.pow(1 - t, 3);
const easeInOut = t => t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
const easeBack = t => { const c1 = 1.70158, c3 = c1 + 1; return 1 + c3 * Math.pow(t - 1, 3) + c1 * Math.pow(t - 1, 2); };
const angDiff = (a, b) => { let d = b - a; while (d > Math.PI) d -= Math.PI * 2; while (d < -Math.PI) d += Math.PI * 2; return d; };
const $ = id => document.getElementById(id);
const rnd = (a, b) => a + Math.random() * (b - a);
const SAVE_KEY = 'busBonanza.zaib.v1';
const DEF_SAVE = () => ({ lvl: 1, stars: {}, coins: 150, boosters: { slot: 2, shuffle: 2, undo: 3, heli: 2, magnet: 2 }, skins: ['classic'], skin: 'classic', themes: ['city'], theme: 'city', settings: { sound: true, music: true, vibe: true, gfx: 'auto' }, daily: { date: '', done: false, streak: 0, last: '' }, seen: {}, tut: {}, stats: { wins: 0, buses: 0, pax: 0 } });
let SAVE = DEF_SAVE();
function loadSave() { try { const s = JSON.parse(localStorage.getItem(SAVE_KEY) || 'null'); if (s) { const d = DEF_SAVE(); SAVE = Object.assign(d, s); SAVE.settings = Object.assign(d.settings, s.settings || {}); SAVE.boosters = Object.assign(DEF_SAVE().boosters, s.boosters || {}); SAVE.daily = Object.assign(DEF_SAVE().daily, s.daily || {}); SAVE.stats = Object.assign(DEF_SAVE().stats, s.stats || {}); } } catch (e) { } }
function saveGame() { try { localStorage.setItem(SAVE_KEY, JSON.stringify(SAVE)); } catch (e) { } }
function todayStr(d) { d = d || new Date(); return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); }
// ================= core rules, solver & level generator (shared with Node tools) =================
function mulberry32(a) { return function () { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const DIRS = [[0, -1], [1, 0], [0, 1], [-1, 0]];
const CAP_LEN = { 4: 2, 6: 3, 10: 4 };
const NCOLORS = 8;

// ---------- level (de)serialisation ----------
// lot: {m:'lot',c,r,k,t,o:[[x,y]],b:[[x,y,d,cap,col,flags,key,ice]],g:[[x,y,d]],gb:[[g,col]],q:"0123",v:[ids]}
function expandLevel(D) {
  const L = JSON.parse(JSON.stringify(D));
  if (L.m === 'lot') {
    L.bus = [];
    for (const a of L.b) L.bus.push({ x: a[0], y: a[1], d: a[2], cap: a[3], col: a[4], hid: !!(a[5] & 1), lock: a[6] == null ? -1 : a[6], ice: a[7] || 0, g: -1 });
    L.gar = (L.g || []).map(a => ({ x: a[0], y: a[1], d: a[2], list: [] }));
    for (const [gi, col] of (L.gb || [])) { const G = L.gar[gi], dv = DIRS[G.d]; G.list.push(L.bus.length); L.bus.push({ x: G.x + dv[0], y: G.y + dv[1], d: G.d, cap: 4, col, hid: false, lock: -1, ice: 0, g: gi }); }
    for (const b of L.bus) b.len = CAP_LEN[b.cap];
    L.Q = L.q.split('').map(Number); L.vip = new Set(L.v || []); L.obs = L.o || [];
    // which bus holds the key for a locked bus
    for (const b of L.bus) b.keyFor = -1;
    L.bus.forEach((b, i) => { if (b.lock >= 0) L.bus[b.lock].keyFor = i; });
  } else {
    L.pas = L.p.map(a => ({ x: a[0], y: a[1], col: a[2], hid: !!(a[3] & 1), vip: !!(a[3] & 2) }));
    L.walls = L.w || []; L.buses = L.bs.map(a => ({ col: a[0], cap: a[1] }));
  }
  return L;
}
function busCells(b) { const dv = DIRS[b.d], out = []; for (let i = 0; i < b.len; i++) out.push([b.x + dv[0] * i, b.y + dv[1] * i]); return out; }

// ================= LOT MODE =================
function lotInit(L) {
  const S = { st: new Uint8Array(L.bus.length), bays: [], q: L.Q.map((c, i) => i), qi: 0, exits: 0, k: L.k };
  L.bus.forEach((b, i) => S.st[i] = b.g >= 0 ? 0 : 1);
  lotSpawn(L, S, null);
  return S;
}
function lotClone(S) { return { st: S.st.slice(), bays: S.bays.map(b => b.slice()), q: S.q.slice(), qi: S.qi, exits: S.exits, k: S.k }; }
function lotOcc(L, S) {
  const occ = new Int16Array(L.c * L.r).fill(-1);
  for (const [x, y] of L.obs) occ[y * L.c + x] = -2;
  for (const G of L.gar) occ[G.y * L.c + G.x] = -3;
  for (let i = 0; i < L.bus.length; i++) if (S.st[i] === 1) for (const [x, y] of busCells(L.bus[i])) occ[y * L.c + x] = i;
  return occ;
}
// returns {ok, steps, hit} – steps = free cells before the obstacle
function lotPath(L, i, occ) {
  const b = L.bus[i], dv = DIRS[b.d]; let x = b.x + dv[0] * b.len, y = b.y + dv[1] * b.len, steps = 0;
  while (x >= 0 && y >= 0 && x < L.c && y < L.r) { const o = occ[y * L.c + x]; if (o !== -1 && o !== i) return { ok: false, steps, hit: o }; x += dv[0]; y += dv[1]; steps++; }
  return { ok: true, steps };
}
function lotLocked(L, S, i) { const b = L.bus[i]; return b.lock >= 0 && S.st[b.lock] !== 2; }
function lotFrozen(L, S, i) { return S.exits < L.bus[i].ice; }
function lotCheck(L, S, i, occ) {
  if (S.st[i] !== 1) return 'gone';
  if (lotLocked(L, S, i)) return 'locked';
  if (lotFrozen(L, S, i)) return 'frozen';
  const p = lotPath(L, i, occ || lotOcc(L, S)); if (!p.ok) return 'blocked';
  if (S.bays.length >= S.k) return 'nobay';
  return 'ok';
}
function lotFreeSlot(S) { const used = new Set(S.bays.map(b => b[2])); for (let s = 0; s < S.k; s++) if (!used.has(s)) return s; return -1; }
function lotSpawn(L, S, ev) {
  for (let gi = 0; gi < L.gar.length; gi++) {
    const G = L.gar[gi]; let nx = -1;
    for (const bi of G.list) { if (S.st[bi] === 1) { nx = -2; break; } if (S.st[bi] === 0) { nx = bi; break; } }
    if (nx < 0) continue;
    const occ = lotOcc(L, S); if (busCells(L.bus[nx]).every(([x, y]) => occ[y * L.c + x] === -1)) { S.st[nx] = 1; ev && ev.push({ t: 'spawn', bi: nx, g: gi }); }
  }
}
function lotBoard(L, S, ev) {
  while (S.qi < S.q.length) {
    const pid = S.q[S.qi], c = L.Q[pid]; let bay = null;
    for (const b of S.bays) if (L.bus[b[0]].col === c && b[1] < L.bus[b[0]].cap) { bay = b; break; }
    if (!bay) break;
    bay[1]++; S.qi++; ev && ev.push({ t: 'board', bi: bay[0], pid });
    if (bay[1] >= L.bus[bay[0]].cap) { S.bays.splice(S.bays.indexOf(bay), 1); ev && ev.push({ t: 'depart', bi: bay[0] }); }
  }
}
// move bus i out (heli = helicopter lift ignores blockers). returns events
function lotTap(L, S, i, heli) {
