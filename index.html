*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;width:100%;height:100%;overflow:hidden;background:#3d8fe8;color:#fff;font-family:"ZB","Trebuchet MS",system-ui,sans-serif;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;overscroll-behavior:none;touch-action:none}
body{position:fixed;inset:0}
canvas#game{position:fixed;left:0;top:0;width:100%;height:100%;display:block;touch-action:none}
.hidden{display:none!important}
button{font-family:inherit;cursor:pointer}
.screen{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:calc(env(safe-area-inset-top) + 14px) calc(env(safe-area-inset-right) + 14px) calc(env(safe-area-inset-bottom) + 12px) calc(env(safe-area-inset-left) + 14px);z-index:10}
.dim{background:rgba(18,34,90,.55);backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px)}
.screen.show>*{animation:pop .42s cubic-bezier(.2,1.5,.4,1) both}
@keyframes pop{from{opacity:0;transform:translateY(16px) scale(.9)}to{opacity:1;transform:none}}
.panel{position:relative;width:100%;max-width:400px;max-height:100%;display:flex;flex-direction:column;gap:10px;background:linear-gradient(180deg,#fff,#eaf3ff);border:4px solid #fff;border-radius:28px;color:#1f3170;padding:38px 18px 18px;box-shadow:0 8px 0 #9cb8e4,0 24px 44px rgba(10,30,90,.45)}
.panel h2{position:absolute;left:50%;top:-24px;transform:translateX(-50%);margin:0;white-space:nowrap;padding:6px 28px;font-size:26px;color:#fff;border-radius:18px;background:linear-gradient(180deg,#5fb4ff,#2a6fe0);box-shadow:0 5px 0 #1a4aa6;text-shadow:0 2px 0 rgba(0,0,0,.25);font-weight:400}
.panel p{margin:0;text-align:center;font-size:18px;line-height:1.3}
.btn{position:relative;display:flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:18px;padding:10px 18px;min-height:54px;font-size:22px;color:#fff;background:linear-gradient(180deg,#6fd0ff,#2a86e8);box-shadow:0 6px 0 #1a56b0,0 10px 18px rgba(0,0,0,.25);text-shadow:0 2px 0 rgba(0,0,0,.25);width:100%}
.btn::before{content:"";position:absolute;left:7%;right:7%;top:4px;height:40%;border-radius:14px;background:linear-gradient(180deg,rgba(255,255,255,.55),rgba(255,255,255,0));pointer-events:none}
.btn:active{transform:translateY(5px);box-shadow:0 1px 0 #1a56b0}
.btn.g{background:linear-gradient(180deg,#8ef06a,#2fb84a);box-shadow:0 6px 0 #1d7a2e,0 10px 18px rgba(0,0,0,.25)}
.btn.o{background:linear-gradient(180deg,#ffd76a,#ff9a1e);box-shadow:0 6px 0 #b55e00,0 10px 18px rgba(0,0,0,.25)}
.btn.r{background:linear-gradient(180deg,#ff8a9a,#e8404f);box-shadow:0 6px 0 #a01e2c,0 10px 18px rgba(0,0,0,.25)}
.btn.gr{background:linear-gradient(180deg,#c3cde0,#8592ad);box-shadow:0 6px 0 #5a6580,0 10px 18px rgba(0,0,0,.2)}
.btn.big{min-height:66px;font-size:30px}
.btn[disabled]{filter:grayscale(.9) brightness(.9)}
.row{display:flex;gap:10px;width:100%}
.coin{display:inline-block;width:20px;height:20px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff7b8,#ffc928 50%,#d27c00);border:2px solid #9a5200;vertical-align:-3px;flex:none}
/* HUD */
#hud{position:fixed;inset:0;pointer-events:none;z-index:5}
#hud .top{position:absolute;left:0;right:0;top:0;display:flex;align-items:flex-start;gap:8px;padding:calc(env(safe-area-inset-top) + 10px) calc(env(safe-area-inset-right) + 10px) 0 calc(env(safe-area-inset-left) + 10px)}
.hb{pointer-events:auto;position:relative;width:48px;height:48px;border-radius:15px;border:0;background:linear-gradient(180deg,#7cc6ff,#2f7fe6);box-shadow:0 5px 0 #1c4fa8,0 8px 14px rgba(0,0,0,.25),inset 0 2px 0 rgba(255,255,255,.5);display:flex;align-items:center;justify-content:center;flex:none}
.hb:active{transform:translateY(4px);box-shadow:0 1px 0 #1c4fa8}
.hb svg{width:26px;height:26px}
.badge{position:absolute;right:-7px;top:-7px;min-width:22px;height:22px;padding:0 5px;border-radius:11px;background:#ff4b5c;border:2px solid #fff;font-size:13px;line-height:18px;color:#fff;text-align:center}
.badge.plus{background:#3cc85a;font-size:17px;line-height:17px}
#lvl{flex:1;text-align:center;font-size:27px;color:#fff;-webkit-text-stroke:5px #23408f;paint-order:stroke fill;text-shadow:0 3px 0 rgba(20,40,110,.6);line-height:1.1;padding-top:6px;pointer-events:none}
#lvl small{display:block;font-size:13px;letter-spacing:1px;-webkit-text-stroke:3px #23408f}
#coins{pointer-events:auto;display:flex;align-items:center;gap:5px;height:34px;margin-top:7px;padding:0 10px 0 6px;border-radius:17px;background:rgba(20,40,100,.55);border:2px solid rgba(255,255,255,.7);font-size:17px}
#pw{position:absolute;display:flex;gap:min(4vw,22px);justify-content:center;pointer-events:none}
.pb{pointer-events:auto;position:relative;width:min(25vw,104px);height:min(19vw,80px);border:0;border-radius:22px;background:linear-gradient(180deg,#8fd3ff,#3b8df0 60%,#2f74d6);box-shadow:0 6px 0 #1d4fa6,0 10px 18px rgba(0,0,0,.28),inset 0 3px 0 rgba(255,255,255,.55);display:flex;flex-direction:column;align-items:center;justify-content:flex-end;padding-bottom:4px;color:#fff;font-size:min(4.4vw,19px);text-shadow:0 2px 0 rgba(20,40,110,.6)}
.pb:active{transform:translateY(5px);box-shadow:0 1px 0 #1d4fa6}
.pb canvas{position:absolute;left:50%;top:-16%;transform:translateX(-50%);width:78%;height:78%;pointer-events:none}
.pb.on{background:linear-gradient(180deg,#ffe17a,#ffa41e);box-shadow:0 6px 0 #b55e00,0 0 22px 6px rgba(255,220,90,.85)}
#banner{position:absolute;left:50%;transform:translateX(-50%);padding:8px 18px;border-radius:16px;background:rgba(255,255,255,.95);color:#1f3170;font-size:18px;white-space:normal;text-align:center;max-width:92vw;width:max-content;box-shadow:0 5px 0 rgba(20,50,130,.35);pointer-events:none;animation:bIn .3s both}
@keyframes bIn{from{opacity:0;transform:translateX(-50%) scale(.8)}to{opacity:1;transform:translateX(-50%)}}
#toast{position:fixed;left:50%;top:40%;transform:translateX(-50%);padding:10px 20px;border-radius:16px;background:rgba(20,30,80,.88);font-size:19px;opacity:0;transition:opacity .25s;pointer-events:none;z-index:30;white-space:nowrap}
#toast.on{opacity:1}
/* title */
.logo{text-align:center;line-height:.85;filter:drop-shadow(0 7px 0 rgba(10,30,100,.35))}
.logo b{display:block;font-weight:400;font-size:min(19vw,96px);color:#ffd84a;-webkit-text-stroke:9px #1f3a9a;paint-order:stroke fill;text-shadow:0 7px 0 #1f3a9a,0 10px 18px rgba(0,0,40,.35);letter-spacing:2px}
.logo b+b{color:#fff;font-size:min(15vw,76px)}
.logo span{display:inline-block;margin-top:10px;font-size:18px;padding:3px 16px;border-radius:999px;background:#ff5c8a;box-shadow:0 3px 0 #a52653}
.links{display:flex;gap:18px;justify-content:center;font-size:16px}
.links a{color:#fff;text-decoration:none;border-bottom:2px dashed rgba(255,255,255,.6)}
.tcol{display:flex;flex-direction:column;gap:14px;width:100%;max-width:320px}
/* level map */
#lvGrid{display:grid;grid-template-columns:repeat(5,1fr);gap:9px;overflow-y:auto;touch-action:pan-y;-webkit-overflow-scrolling:touch;padding:6px 4px 10px;max-height:58vh}
.lv{position:relative;aspect-ratio:1;border:0;border-radius:16px;font-size:20px;color:#fff;box-shadow:0 4px 0 rgba(0,0,0,.25),inset 0 2px 0 rgba(255,255,255,.5);text-shadow:0 2px 0 rgba(0,0,0,.3);padding:0 0 8px}
.lv i{position:absolute;left:0;right:0;bottom:3px;font-style:normal;font-size:10px;letter-spacing:-1px;color:#ffd84a}
.lv.lock{filter:grayscale(1) brightness(.85);opacity:.6}
.lv.cur{outline:3px solid #ffd84a;animation:glow 1s infinite alternate}
@keyframes glow{to{box-shadow:0 0 16px 4px rgba(255,216,74,.9)}}
.set{display:flex;align-items:center;justify-content:space-between;font-size:20px;padding:6px 2px;border-bottom:2px solid #d6e4f7}
.tog{width:64px;height:36px;border-radius:18px;border:0;background:#c5d2e6;position:relative}
.tog::after{content:"";position:absolute;left:4px;top:4px;width:28px;height:28px;border-radius:50%;background:#fff;box-shadow:0 2px 4px rgba(0,0,0,.25);transition:.15s}
.tog.on{background:#3cc85a}.tog.on::after{left:32px}
.stars{display:flex;justify-content:center;gap:8px}
.stars i{width:56px;height:56px;background:linear-gradient(180deg,#fff3a0,#ffc400 60%,#e08a00);clip-path:polygon(50% 0,61% 35%,98% 35%,68% 57%,79% 91%,50% 70%,21% 91%,32% 57%,2% 35%,39% 35%);animation:sIn .5s cubic-bezier(.2,1.6,.4,1) both}
.stars i:nth-child(2){width:70px;height:70px;margin-top:-10px;animation-delay:.15s}.stars i:nth-child(3){animation-delay:.3s}
.stars i.off{background:#c9d5e8}
@keyframes sIn{from{transform:scale(0) rotate(-40deg)}}
@media (orientation:landscape) and (max-height:520px){.panel{padding-top:30px;gap:7px}.btn{min-height:44px;font-size:19px}.btn.big{min-height:50px;font-size:24px}.logo b{font-size:min(14vh,80px)}.logo b+b{font-size:min(11vh,60px)}#sTitle{flex-direction:row;gap:30px}#lvGrid{grid-template-columns:repeat(8,1fr);max-height:50vh}}
@media (orientation:landscape) and (max-height:420px){#sModal .panel{padding-top:20px;padding-bottom:12px;gap:5px}#sModal .btn{min-height:40px}#sModal .btn.big{min-height:44px}#mB{gap:8px!important}#mMore{margin-top:4px!important}}
</style>
</head>
